name: Go

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CONTAINER_TOOL: docker
    steps:
      - name: 🛡️ Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            cli.codecov.io:443
            dl.google.com:443
            github.com:443
            go.dev:443
            golang.org:443
            ingest.codecov.io:443
            keybase.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            tuf-repo-cdn.sigstore.dev:443

      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗️ Install dependencies with Mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: ⚙️ Setup Nut Server
        run: |
          just start-nut-server

      - name: 📝 Generate SSL certificates
        run: |
          just generate-certs

      - name: 🧪 Run `go test`
        run: |
          just test

      - name: ⚙️ Shut down Nut Server
        run: |
          just stop-nut-server

      - name: ☂️ Report coverage rates to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ./coverage.txt
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
