[tools]
go = "1.27.0"
"go:go.uber.org/mock/mockgen" = "0.6.0"
golangci-lint = "2.13.2"
hadolint = "2.15.1"
hk = "1.56.1"
just = "1.58.0"
rumdl = "v0.2.62"
swag = "v1.16.6"
zizmor = "1.29.0"

[settings]
lockfile = true
experimental = true

[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"
