[tools]
go = "1.26.6"
"go:go.uber.org/mock/mockgen" = "0.6.0"
golangci-lint = "2.12.2"
hadolint = "2.15.1"
hk = "1.55.0"
just = "1.58.0"
rumdl = "0.2.55"
swag = "v1.16.6"
zizmor = "1.29.0"

[settings]
lockfile = true
experimental = true

[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"
