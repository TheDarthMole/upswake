[tools]
go = "1.27.1"
"go:go.uber.org/mock/mockgen" = "0.6.0"
golangci-lint = "2.13.2"
hadolint = "2.15.1"
hk = "1.58.1"
just = "1.58.0"
rumdl = "v0.2.67"
#swag = "v1.16.6"
"go:github.com/swaggo/swag/cmd/swag" = "v1.16.6" # Builds with go 1.27 which has generic methods to fix swagger linting issues
zizmor = "1.30.0"

[settings]
lockfile = true
experimental = true

[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"
